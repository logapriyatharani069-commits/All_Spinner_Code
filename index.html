<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Spinners</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 {
    padding: 20px;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 40px;
    padding: 30px;
}

/* Common */
.box {
    padding: 20px;
}

/* 1. Basic Spinner */
.spinner1 {
    width: 50px;
    height: 50px;
    border: 5px solid #ccc;
    border-top: 5px solid #38bdf8;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto;
}

/* 2. Double Ring */
.spinner2 {
    width: 50px;
    height: 50px;
    border: 5px solid transparent;
    border-top: 5px solid #f43f5e;
    border-bottom: 5px solid #22c55e;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto;
}

/* 3. Dots Loader */
.spinner3 {
    display: flex;
    justify-content: center;
    gap: 5px;
}

.spinner3 div {
    width: 10px;
    height: 10px;
    background: #facc15;
    border-radius: 50%;
    animation: bounce 0.6s infinite alternate;
}

.spinner3 div:nth-child(2) {
    animation-delay: 0.2s;
}
.spinner3 div:nth-child(3) {
    animation-delay: 0.4s;
}

/* 4. Pulse */
.spinner4 {
    width: 40px;
    height: 40px;
    background: #6366f1;
    border-radius: 50%;
    animation: pulse 1s infinite;
    margin: auto;
}

/* 5. Bars */
.spinner5 {
    display: flex;
    gap: 5px;
    justify-content: center;
}

.spinner5 div {
    width: 6px;
    height: 30px;
    background: #38bdf8;
    animation: stretch 1s infinite;
}

.spinner5 div:nth-child(2) { animation-delay: 0.2s; }
.spinner5 div:nth-child(3) { animation-delay: 0.4s; }
.spinner5 div:nth-child(4) { animation-delay: 0.6s; }

/* Animations */
@keyframes spin {
    100% { transform: rotate(360deg); }
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-10px); }
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0.5; }
}

@keyframes stretch {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(2); }
}
</style>

</head>
<body>

<h1>🔥 Professional Spinners Collection</h1>

<div class="container">

    <div class="box">
        <div class="spinner1"></div>
        <p>Basic Spinner</p>
    </div>

    <div class="box">
        <div class="spinner2"></div>
        <p>Double Ring</p>
    </div>

    <div class="box">
        <div class="spinner3">
            <div></div><div></div><div></div>
        </div>
        <p>Dots Loader</p>
    </div>

    <div class="box">
        <div class="spinner4"></div>
        <p>Pulse Loader</p>
    </div>

    <div class="box">
        <div class="spinner5">
            <div></div><div></div><div></div><div></div>
        </div>
        <p>Bars Loader</p>
    </div>

</div>

</body>
</html>
